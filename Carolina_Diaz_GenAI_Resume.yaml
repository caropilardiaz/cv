      highlights:
      - "FDE & Technical Lead: architected and deployed GenAI, RAG and Multi-Agent solutions for enterprise clients (Banco Galicia, ICBC, Banco Macro, Facturante), defining technical roadmaps and cloud architecture."
      - "Agentic AI (Patagon.IA): 33-node LangGraph state-machine on AWS Bedrock for automated COBOL-legacy BRD/TRD documentation — led prompt engineering (~23 sections) and a 3-judge LLM majority-voting panel with anti-hallucination filters vs. a deterministic golden-truth (20/20 sections verified, 0 pipeline errors)."
      - "Production GenAI apps: WhatsApp sales agent as an MLflow PyFunc model on Databricks (RAG via Vector Search + Gemini); two-agent invoice-extraction & eligibility platform on AWS Lambda + Bedrock (Claude Sonnet/Haiku, Strands framework); React 19 + Gemini conversational data apps."
      - "LLM cost & quality engineering: state-checkpointing to avoid API reprocessing, strict token budgets, dynamic cloud/local routing (AWS Bedrock / Ollama), and an LLM-as-a-judge multi-evaluator with majority voting for hallucination control."
    - company: ITP Patagonia - ICBC
