  sections:
    summary:
    - >-
      AI/ML Engineer, Senior Data Scientist, and Applied Statistician (Economist) with 20+ years of experience
      operating as a Strategic AI/ML Consultant & Forward Deployed Engineer (FDE) for
      global enterprises. I specialize in architecting end-to-end AI products and solutions
      using Python, Machine Learning, and Deep Learning. I build mathematically robust Multi-Agent Systems
      (GenAI, RAG, MCP) that prevent model hallucinations in regulated sectors.
      I have architected and shipped full-stack AI applications, combining the power of
      Python with the rigor of Advanced Statistics, Causal Inference, and MLOps on on-premises, 
      hybrid, and cloud infrastructures across Fintech, AgTech, and Healthcare.
    experience:
    - company: IT Patagonia (Consultant FDE)
      position: Senior AI Engineer
      start_date: 2024-06
      end_date: present
      location: Buenos Aires, Argentina
      highlights:
      - "Forward Deployed Engineer (FDE) & Technical Lead: Directed the architecture and deployment of Generative AI, RAG, and Multi-Agent solutions for enterprise clients (Banco Galicia, ICBC), defining technical roadmaps and optimizing cloud infrastructure."
      - "Agentic AI & Complex Workflows: Architected a 33-node LangGraph state-machine for automated legacy codebase documentation (Patagon.IA) and engineered a 100% asynchronous LlamaIndex RAG pipeline with parallel retrieval for a real-time sales assistant (Facturante)."
      - "LLM Cost Optimization & Resiliency: Implemented state-checkpointing to avoid API reprocessing in long-running LLM pipelines, enforced strict token budgets (`ThinkingConfig`), and designed dynamic routing between cloud (AWS Bedrock) and local (Ollama) foundational models."
      - "Quality Assurance & Serverless Deployments: Built an advanced 'LLM-as-a-judge' multi-evaluator system using majority voting to eliminate hallucinations. Shipped containerized (Docker) hybrid deployments and serverless MLflow PyFunc inference models on Databricks."
    - company: ITP Patagonia - ICBC
      position: Senior Data Scientist
      start_date: 2024-06
      end_date: 2025-07
      location: Buenos Aires, Argentina
      highlights:
      - "Developed predictive models for payroll clients and mutual fund investment using AWS SageMaker, AutoML, Canvas, and Neural Networks/XGBoost. Impact: enabled efficient predictions and insights for improved decision-making."
      - "Built an anomaly detection model using Neural Networks (AENN), Isolation Forest, and SHAP for interpretability using Azure. Impact: integrated into fraud monitoring systems for efficient detection and prevention."
      - "Currently developing a fraud detection model with AWS Fraud Detector, leveraging Decision Trees, Neural Networks, Time Series Analysis, and Custom Fraud Prediction. Impact: significantly reduced client account lockouts (Project Owner)."
    - company: Nubiral S.A.
      position: Senior Data Scientist. COE, Commission of Expert. Generative 
        Models.
      start_date: 2023-10
      end_date: 2024-05
      location: Buenos Aires, Argentina
      highlights:
      - "Airline solution: Integrated AWS Rekognition, Lambda, S3, LangChain, and OpenAI GPT for Computer Vision and Generative AI, improving object detection accuracy and increasing precision at Aerolíneas Argentinas."
      - "Developed a Post-Call Analytics solution using AWS services (Transcribe, Comprehend, Lambda, QuickSight) to analyze customer interactions, extract insights, and generate actionable reports to improve customer service at Telecom S.A. Impact: Improved efficiency."
      - "Implemented Azure Cognitive Search and Form Recognizer for efficient PDF document management at Banco Macro, enhancing data extraction and document accessibility across the organization. Impact: Streamlined operations."
    - company: Pi Data Strategy & Consulting
      position: Semi-Senior Data Scientist, Statistician, Economist
      start_date: 2021-03
      end_date: 2023-10
      location: Córdoba, Argentina
      highlights:
      - "Consulting and advice: Created data regression models, predictive data modelling, and analyzed data mining algorithms, creating end-to-end pipelines to deploy on Azure."
      - "Applied Machine Learning, Speech Tech (Sequence Matcher), and NLP using IBM technology. Performed EDA, statistical analysis, and built neural networks for Pernod Ricard, Don Mario (GDM Seeds), and Anheuser-Busch InBev."
      - "Developed sales forecasting models for georeferenced datasets and multinomial predictive models for customer satisfaction levels (Project Owner)."
    - company: National Institute of Agriculture Technology (INTA)
      position: Lead Statistician / Head of Statistical Research
      start_date: 2012-01
      end_date: 2021-12
      location: Manfredi, Córdoba, Argentina
